vector_store:
  use: qdrant
  embedding:
    provider: sentence_transformer  # can be 'sentence_transformer', 'openai', or 'gemini'
    gemini:
      model_name: all-MiniLM-L6-v2
      dimensionality: 384
      batch_size: 100
      score_threshold: 0.75
    openai:
      model_name: text-embedding-3-small
      dimensionality: 1536
      batch_size: 100
      score_threshold: 0.75
    sentence_transformer:
      model_name: all-MiniLM-L6-v2
      dimensionality: 384
      batch_size: 100
      score_threshold: 0.75
  qdrant:
